[pytest]
testpaths = tests
pythonpath = .
norecursedirs = tests/data
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --alluredir=reports/allure-results
    -v
log_cli = true
log_cli_level = INFO
markers =
    smoke: smoke tests (critical happy paths)
    regression: regression tests (full coverage)
    positive: happy path — expected success
    negative: error path — expected failure
    admin: проверка с правами админа
    partner: проверка с правами партнера
    authorization: проверяется только авторизация
    user_info: проверяется только страница user_info
    menu: проверяется только страница menu
    two_fa: проверяется только страница 2fa
    registration: проверяется только регистрация (партнер)
    forgot_password: проверяется только отправка почты для нового пароля (партнер)
    form_select: проверяется только запрос form_select
    send_log: проверяется отправка логов при ошибке
    get_last_news_item: проверяется всплывающие сообщения - новости
    base: проверка возвращения список настроек
    account_settings: проверяется страница /account_settings
    change_password: проверяется изменение пароля
    notifications: проверяется страница /application.notifications
    check_sms_for_account_access: проверяется /application.check_sms_for_account_access
    popups: проверяется страница /application.popups
    change_timezone: проверяется изменение часового пояса
    change_language: проверяется изменение языка
    update_otp: проверяется обновление OTP
    account_settings_fields: проверяется страница /account_settings.fields
    advertising: проверяется страница /advertising
    articles: проверяется страница /articles
    articles_delete: проверяется /articles.delete
